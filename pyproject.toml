[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "law-exam-study-core"
version = "0.2.0"
description = "可复用的法考主观题学习准备与规则核心"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf"]
export = ["reportlab>=4.0,<5", "pypdf>=5,<7"]

[tool.setuptools]
packages = ["lawstudy"]

