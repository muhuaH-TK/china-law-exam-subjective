[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "law-exam-study-core"
version = "0.3.1"
description = "中国法律职业资格考试主观题复习：四阶段计划、错题订正与题源监测"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf"]
export = ["reportlab>=4.0,<5", "pypdf>=5,<7"]

[tool.setuptools]
packages = ["lawstudy"]

# 当前发行入口是完整源码目录中的run.py；不声明尚未验证的安装后命令。
